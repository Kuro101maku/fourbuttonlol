name: Build repaired Android v16 APK
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-v16-repair.yml"
      - "KuroAssistant_v16.zip"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare project and repair v16 Kotlin scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q KuroAssistant_v16.zip -d extracted
          SOURCE="$(find extracted -type f -name MainActivity.kt -print -quit)"
          test -n "$SOURCE"
          PACKAGE="$(grep -m1 -E '^\s*package\s+' "$SOURCE" | sed -E 's/^\s*package\s+([^ ;]+).*$/\1/' || true)"
          test -n "$PACKAGE" || PACKAGE="com.kuro.fourbuttonpad"
          PACKAGE_PATH="$(echo "$PACKAGE" | tr '.' '/')"
          PROJECT_DIR=android-project
          mkdir -p "$PROJECT_DIR/app/src/main/java/$PACKAGE_PATH"
          if [ -d extracted/app/src/main ]; then
            cp -R extracted/app/src/main/. "$PROJECT_DIR/app/src/main/"
          else
            cp "$SOURCE" "$PROJECT_DIR/app/src/main/java/$PACKAGE_PATH/MainActivity.kt"
          fi
          SOURCE="$(find "$PROJECT_DIR/app/src/main/java" -type f -name MainActivity.kt -print -quit)"
          python3 - "$SOURCE" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          pattern=r'(?m)^\s*var restEnteredAtMs by remember \{\n\s*mutableStateOf\(if \(initialState\.mode == PadMode\.REST\) System\.currentTimeMillis\(\) else 0L\)\n\s*\}\n\s*var restIdleNotifiedForSession by remember \{ mutableStateOf\(false\) \}'
          m=re.search(pattern,s)
          if not m: raise SystemExit("Expected rest-session Compose state declarations were not found.")
          block=m.group(0)
          s=s[:m.start()]+s[m.end():]
          target=re.search(r'(?m)^\s*fun applyModeSelection\(chosen: PadMode\)',s)
          if not target: raise SystemExit("Could not locate applyModeSelection.")
          s=s[:target.start()]+block+"\n\n"+s[target.start():]
          p.write_text(s)
          print("Moved Compose rest-session state above applyModeSelection.")
          PY
          cat > "$PROJECT_DIR/settings.gradle.kts" <<'SETTINGS'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FourButtonPad"
          include(":app")
          SETTINGS
          cat > "$PROJECT_DIR/build.gradle.kts" <<'ROOT'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          ROOT
          cat > "$PROJECT_DIR/app/build.gradle.kts" <<'APP'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "__PACKAGE__"
              compileSdk = 35
              defaultConfig {
                  applicationId = "__PACKAGE__"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 16
                  versionName = "16"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          APP
          sed -i "s/__PACKAGE__/$PACKAGE/g" "$PROJECT_DIR/app/build.gradle.kts"
          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            cat > "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<MANIFEST
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="true" android:label="Four Button Pad" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name="$PACKAGE.MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST
          fi
          mkdir -p "$PROJECT_DIR"
          printf '\nandroid.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8\n' >> "$PROJECT_DIR/gradle.properties"
          find "$PROJECT_DIR/app/src/main/res" -type f -name '*.xml' -print0 | xargs -0 -r sed -i -E 's/[[:space:]]+android:pathType="[^"]*"//g'
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle --no-daemon assembleDebug
      - name: Collect APK
        run: |
          mkdir -p apk
          find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -exec cp {} apk/ \;
          test -n "$(ls -A apk)"
      - uses: actions/upload-artifact@v4
        with:
          name: FourButtonPad-v16-repaired
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 14
