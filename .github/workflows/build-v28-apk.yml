name: Build signed Android v28 APK
on:
  push:
    branches: [main]
    paths:
      - "KuroAssistant_v28 (1).zip"
      - ".github/workflows/build-v28-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify persistent signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=(KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Configure the four secrets in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All signing secrets are configured."
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare v28 Android project
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q 'KuroAssistant_v28 (1).zip' -d extracted
          SOURCE="$(find extracted -type f -name MainActivity.kt -print -quit)"
          test -n "$SOURCE" || { echo "No MainActivity.kt found in v28 ZIP"; find extracted -maxdepth 6 -type f; exit 1; }
          PACKAGE="com.example.fourbuttonpad"
          PACKAGE_PATH="$(echo "$PACKAGE" | tr '.' '/')"
          PROJECT_DIR=android-project
          mkdir -p "$PROJECT_DIR/app/src/main/java/$PACKAGE_PATH"
          if [ -d extracted/app/src/main ]; then
            cp -R extracted/app/src/main/. "$PROJECT_DIR/app/src/main/"
          else
            cp "$SOURCE" "$PROJECT_DIR/app/src/main/java/$PACKAGE_PATH/MainActivity.kt"
          fi
          SOURCE="$(find "$PROJECT_DIR/app/src/main/java" -type f -name MainActivity.kt -print -quit)"
          ACTUAL_PACKAGE="$(grep -m1 -E '^\s*package\s+' "$SOURCE" | sed -E 's/^\s*package\s+([^ ;]+).*$/\1/' || true)"
          if [ "$ACTUAL_PACKAGE" != "$PACKAGE" ]; then
            echo "::error::Package mismatch: expected $PACKAGE but source declares $ACTUAL_PACKAGE"
            exit 1
          fi
          # Keep the known v16 Compose state scope repair if this exact pattern exists.
          python3 - "$SOURCE" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          pattern=r'(?m)^\s*var restEnteredAtMs by remember \{\n\s*mutableStateOf\(if \(initialState\.mode == PadMode\.REST\) System\.currentTimeMillis\(\) else 0L\)\n\s*\}\n\s*var restIdleNotifiedForSession by remember \{ mutableStateOf\(false\) \}'
          m=re.search(pattern,s)
          if m:
              block=m.group(0); s=s[:m.start()]+s[m.end():]
              target=re.search(r'(?m)^\s*fun applyModeSelection\(chosen: PadMode\)',s)
              if not target: raise SystemExit("Found state block but no applyModeSelection target.")
              s=s[:target.start()]+block+"\n\n"+s[target.start():]
              print("Moved Compose state before local function.")
          p.write_text(s)
          PY
          python3 - "$SOURCE" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          if "cancelChildren(" in s and "import kotlinx.coroutines.cancelChildren" not in s:
              lines=s.splitlines(True)
              i=next((i for i,line in enumerate(lines) if line.startswith("package ")),None)
              if i is None: raise SystemExit("Package declaration not found")
              lines.insert(i+1,"\nimport kotlinx.coroutines.cancelChildren\n")
              p.write_text("".join(lines))
              print("Added cancelChildren import.")
          PY
          cat > "$PROJECT_DIR/settings.gradle.kts" <<'SETTINGS'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FourButtonPad"
          include(":app")
          SETTINGS
          cat > "$PROJECT_DIR/build.gradle.kts" <<'ROOT'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          ROOT
          echo "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/keystore.jks"
          cat > "$PROJECT_DIR/app/build.gradle.kts" <<'APP'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.fourbuttonpad"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.fourbuttonpad"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 28
                  versionName = "0.28"
              }
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file("keystore.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          APP
          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            cat > "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="true" android:label="Помощник Куро" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name="com.example.fourbuttonpad.MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST
          fi
          printf '\nandroid.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8\n' >> "$PROJECT_DIR/gradle.properties"
          find "$PROJECT_DIR/app/src/main/res" -type f -name '*.xml' -print0 | xargs -0 -r sed -i -E 's/[[:space:]]+android:pathType="[^"]*"//g'
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Build signed release APK v28
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd "$PROJECT_DIR" && gradle --no-daemon assembleRelease
      - name: Collect and verify signed APK
        run: |
          set -euo pipefail
          mkdir -p apk
          APK="$(find "$PROJECT_DIR" -type f -name "*.apk" -path "*/build/outputs/*" -print -quit)"
          test -n "$APK" || { echo "APK not found"; exit 1; }
          cp "$APK" apk/KuroAssistant_v28.apk
          ls -lh apk/KuroAssistant_v28.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KuroAssistant-v28-signed-APK
          path: apk/KuroAssistant_v28.apk
          if-no-files-found: error
          retention-days: 14
