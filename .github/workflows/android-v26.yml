name: Build Android v26 APK
# v26 build pipeline
# v26 build pipeline
on:
  push:
    branches: [main]
    paths:
      - "KuroAssistant_v26.zip"
      - ".github/workflows/android-v26.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare v26 project
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q KuroAssistant_v26.zip -d extracted
          SOURCE="$(find extracted -type f -name MainActivity.kt -print -quit)"
          test -n "$SOURCE" || { echo "No MainActivity.kt found in v26 ZIP"; find extracted -maxdepth 6 -type f; exit 1; }
          PACKAGE="$(grep -m1 -E '^\s*package\s+' "$SOURCE" | sed -E 's/^\s*package\s+([^ ;]+).*$/\1/' || true)"
          test -n "$PACKAGE" || PACKAGE="com.kuro.fourbuttonpad"
          PACKAGE_PATH="$(echo "$PACKAGE" | tr '.' '/')"
          PROJECT_DIR=android-project
          mkdir -p "$PROJECT_DIR/app/src/main/java/$PACKAGE_PATH"
          if [ -d extracted/app/src/main ]; then
            cp -R extracted/app/src/main/. "$PROJECT_DIR/app/src/main/"
          else
            cp "$SOURCE" "$PROJECT_DIR/app/src/main/java/$PACKAGE_PATH/MainActivity.kt"
          fi
          SOURCE="$(find "$PROJECT_DIR/app/src/main/java" -type f -name MainActivity.kt -print -quit)"
          # v16 had a lexical-scope error. Apply the move only if v26 still has that exact pattern.
          python3 - "$SOURCE" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          pattern=r'(?m)^\s*var restEnteredAtMs by remember \{\n\s*mutableStateOf\(if \(initialState\.mode == PadMode\.REST\) System\.currentTimeMillis\(\) else 0L\)\n\s*\}\n\s*var restIdleNotifiedForSession by remember \{ mutableStateOf\(false\) \}'
          m=re.search(pattern,s)
          if m:
              block=m.group(0); s=s[:m.start()]+s[m.end():]
              target=re.search(r'(?m)^\s*fun applyModeSelection\(chosen: PadMode\)',s)
              if not target: raise SystemExit("Found v16 state block but no applyModeSelection target.")
              s=s[:target.start()]+block+"\n\n"+s[target.start():]
              print("Moved rest-session Compose state before local function.")
          else:
              print("v26 does not contain the old v16 state block; no scope patch needed.")
          p.write_text(s)
          PY
          # v26 uses Job.cancelChildren(); ensure its coroutine extension is imported.
          python3 - "$SOURCE" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          if "cancelChildren(" in s and "import kotlinx.coroutines.cancelChildren" not in s:
              lines=s.splitlines(True)
              package_index=next((i for i,line in enumerate(lines) if line.startswith("package ")),None)
              if package_index is None: raise SystemExit("Package declaration not found for coroutine import patch")
              lines.insert(package_index+1,"\nimport kotlinx.coroutines.cancelChildren\n")
              s="".join(lines); p.write_text(s)
              print("Added kotlinx.coroutines.cancelChildren import.")
          else:
              print("cancelChildren import already present or unused.")
          PY
          cat > "$PROJECT_DIR/settings.gradle.kts" <<'SETTINGS'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FourButtonPad"
          include(":app")
          SETTINGS
          cat > "$PROJECT_DIR/build.gradle.kts" <<'ROOT'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          ROOT
          cat > "$PROJECT_DIR/app/build.gradle.kts" <<'APP'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "__PACKAGE__"
              compileSdk = 35
              defaultConfig {
                  applicationId = "__PACKAGE__"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 26
                  versionName = "26"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          APP
          sed -i "s/__PACKAGE__/$PACKAGE/g" "$PROJECT_DIR/app/build.gradle.kts"
          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            cat > "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<MANIFEST
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="true" android:label="KuroAssistant" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name="$PACKAGE.MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST
          fi
          printf '\nandroid.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8\n' >> "$PROJECT_DIR/gradle.properties"
          find "$PROJECT_DIR/app/src/main/res" -type f -name '*.xml' -print0 | xargs -0 -r sed -i -E 's/[[:space:]]+android:pathType="[^"]*"//g'
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Build v26 debug APK
        run: cd "$PROJECT_DIR" && gradle --no-daemon assembleDebug
      - name: Collect APK
        run: |
          mkdir -p apk
          APK="$(find "$PROJECT_DIR" -type f -name "*.apk" -path "*/build/outputs/*" -print -quit)"
          test -n "$APK" || { echo "APK not found in build outputs"; find "$PROJECT_DIR" -type f -path "*/build/outputs/*" -print; exit 1; }
          cp "$APK" apk/
          ls -lh apk
      - uses: actions/upload-artifact@v4
        with:
          name: KuroAssistant-v26-APK
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 14

