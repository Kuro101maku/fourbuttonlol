name: Prepare KuroAssistant v1.31 archive
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-v131.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch, archive v1.30 and create v1.31
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SOURCE="KuroAssistant_v_31_fixed.zip"
          test -f "$SOURCE" || { echo "::error::Source archive not found: $SOURCE"; exit 1; }
          rm -rf /tmp/kuro131
          mkdir -p /tmp/kuro131/src
          unzip -q "$SOURCE" -d /tmp/kuro131/src
          git apply --recount --check patches/v131-game-log.patch
          git apply --recount patches/v131-game-log.patch
          # Preserve the v30 source under a semantic version name and clean older ZIPs.
          if [ -f KuroAssistant_v_30.zip ]; then
            git mv KuroAssistant_v_30.zip KuroAssistant_v_1.30.zip
          fi
          find . -maxdepth 1 -type f -name '*.zip' ! -name 'KuroAssistant_v_1.30.zip' ! -name 'KuroAssistant_v_31_fixed.zip' -delete
          git add -A
          git commit -m "Archive source as v1.30 and clean old ZIPs"
          git push origin main
          # Rebuild the patched source archive, with the original project root structure.
          (cd /tmp/kuro131/src && zip -qr "$GITHUB_WORKSPACE/KuroAssistant_v_1.31.zip" .)
          find . -maxdepth 1 -type f -name '*.zip' ! -name 'KuroAssistant_v_1.30.zip' ! -name 'KuroAssistant_v_1.31.zip' -delete
          git add -A KuroAssistant_v_1.31.zip
          git commit -m "Add patched KuroAssistant v1.31"
          git push origin main
          # GITHUB_TOKEN pushes do not automatically trigger other workflows; dispatch the APK build explicitly.
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Kuro101maku/fourbuttonlol/actions/workflows/build-latest-apk.yml/dispatches \
            -d '{"ref":"main"}'
